<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX Design — Portfólio de LPs</title>
    <meta name="description" content="Portfólio de landing pages focadas em experiência de usuário, conversão e qualidade visual.">
    <meta property="og:title" content="UX Design — Portfólio de Landing Pages">
    <meta property="og:description" content="Landing pages transformadoras: franquias, catálogos digitais e portais de comunidade esportiva.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#00d4d4">
    <link rel="apple-touch-icon" sizes="180x180" href="./public/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./public/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./public/favicon-16x16.png">
    <link rel="manifest" href="./public/site.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <span class="header__eyebrow">Portfólio</span>
      <h1>UX Design</h1>
      <p>Landing Pages Transformadoras</p>
    </header>

    <!-- Carrossel de destaque: só os projetos "cliente" (destaque: true) -->
    <section class="hero-carousel" aria-label="Projetos em destaque" id="heroCarousel">
      <div class="hero-carousel__track" id="heroTrack">
        <!-- slides injetados via JS -->
      </div>
      <button class="hero-carousel__nav hero-carousel__nav--prev" id="heroPrev" aria-label="Slide anterior">&#8249;</button>
      <button class="hero-carousel__nav hero-carousel__nav--next" id="heroNext" aria-label="Próximo slide">&#8250;</button>
      <div class="hero-carousel__dots" id="heroDots"></div>
    </section>

    <section class="catalog-section">
      <h2 class="catalog-section__title">Projetos</h2>
      <div class="projects-grid" id="projectsGrid" aria-label="Projetos de landing pages"></div>
    </section>

    <section class="catalog-section">
      <h2 class="catalog-section__title">Estudos &amp; Formulários</h2>
      <div class="projects-grid projects-grid--compact" id="studiesGrid" aria-label="Formulários de estudo"></div>
    </section>
  </main>

  <script src="catalog.js"></script>
  <script src="script.js"></script>
</body>
</html>
