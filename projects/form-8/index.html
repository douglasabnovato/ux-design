<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download de Catálogo ABC</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="catalog-shell">
      <section class="catalog-card">
        <header class="catalog-header">
          <span class="eyebrow">Catálogo ABC</span>
          <h1>Baixe o catálogo e descubra soluções completas para sua obra</h1>
          <p>Preencha as informações em dois passos e receba acesso ao material digital exclusivo.</p>
        </header>

        <div class="catalog-steps">
          <div class="step active"><span>1</span><p>Contato</p></div>
          <div class="step"><span>2</span><p>Detalhes</p></div>
        </div>

        <div id="catalogMessage" class="catalog-message" aria-live="polite"></div>

        <form id="catalogForm" novalidate>
          <section class="catalog-page active" data-step="1">
            <label>
              Nome completo
              <input type="text" name="name" placeholder="Seu nome" required />
            </label>
            <label>
              E-mail
              <input type="email" name="email" placeholder="seu@email.com" required />
            </label>
            <label>
              WhatsApp
              <input type="tel" name="whatsapp" placeholder="(00) 00000-0000" required />
            </label>
          </section>

          <section class="catalog-page" data-step="2">
            <label>
              Guide Shop favorita
              <select name="guideshop" required>
                <option value="">Selecione</option>
                <option value="novalima">BH - Nova Lima</option>
                <option value="matriz">JF - Matriz</option>
                <option value="paecambu">SP - Paecambu</option>
                <option value="santacruz">RS - Santa Cruz</option>
              </select>
            </label>
            <label>
              Conte sua experiência
              <textarea name="experience" rows="4" placeholder="Ex: já sou cliente ABC, estou pesquisando obra..." required></textarea>
            </label>
            <label class="optin-label">
              <input type="checkbox" name="subscribe" required />
              Concordo em receber o catálogo por e-mail e receber novidades da ABC da Construção.
            </label>
          </section>

          <div class="catalog-actions">
            <button type="button" id="catalogPrev" class="secondary-button" disabled>Voltar</button>
            <button type="button" id="catalogNext" class="primary-button">Próximo</button>
          </div>
        </form>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
