<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:slnt,wght@-10..0,100..900&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevLinks · Douglas Novato</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../../shared/lt-base.css" />
  <link rel="stylesheet" href="../../shared/lt-feedback.css" />
  <script src="../../shared/lt-feedback.js"></script>
  <meta name="description" content="Página DevLinks para apresentar uma lista de links importantes e desafio da trilha." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Dev Link · UX Design" />
  <meta property="og:description" content="Página DevLinks para apresentar uma lista de links importantes e desafio da trilha." />
  <meta property="og:url" content="https://douglasabnovato.github.io/ux-design/projects/dev-link/" />
  <meta property="og:image" content="https://douglasabnovato.github.io/ux-design/assets/devlink.jpg" />
  <style>
    #profile h1 { font-size: 1.1rem; margin-top: 8px; }
    #profile .bio { font-size: .9rem; opacity: .85; margin-top: 4px; }
    #profile img { border-radius: 50%; }
    .copiar { display: block; margin: 16px auto 0; padding: 12px 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,.6); background: rgba(255,255,255,.08); color: #fff; font: inherit; cursor: pointer; }
    .copiar:hover { background: rgba(255,255,255,.18); }
    @media (max-width: 400px) { #container { width: 100%; } }
  </style>
</head>

<body>
  <main id="container">
    <div id="profile">
      <img src="https://github.com/douglasabnovato.png" width="112" height="112"
        alt="Foto de perfil de Douglas Novato no GitHub" />
      <h1>@douglasabnovato</h1>
      <p class="bio">Desenvolvedor e educador em tecnologia · UX, front-end e produto</p>
    </div>
    <ul>
      <li><a href="../../index.html">Ver meu portfólio UX Design</a></li>
      <li><a href="https://github.com/douglasabnovato" target="_blank" rel="noopener">Projetos no GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/douglasabnovato/" target="_blank" rel="noopener">Conectar no LinkedIn</a></li>
      <li><a href="https://wa.me/5532988367667?text=Ol%C3%A1%2C%20Douglas!%20Vim%20pelo%20DevLinks." target="_blank" rel="noopener">Conversar no WhatsApp</a></li>
    </ul>
    <button type="button" class="copiar" id="btn-copiar">Copiar link desta página</button>
  </main>
  <script>
    /* Copia o endereço da página e confirma com aviso (ou mostra o link se falhar). */
    document.getElementById("btn-copiar").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(location.href);
        LT.aviso("Link copiado para a área de transferência.");
      } catch (e) {
        LT.aviso(`Não foi possível copiar. Endereço: ${location.href}`, "erro", 7000);
      }
    });
  </script>
<!-- learnTECH · volta ao catálogo UX Design -->
<style>
.lt-voltar{position:fixed;left:18px;bottom:18px;z-index:99998;display:inline-flex;align-items:center;gap:9px;
padding:11px 16px;border-radius:999px;background:rgba(10,14,39,.92);border:1px solid rgba(0,212,212,.42);
color:#eaf0f7;text-decoration:none;font:700 14px/1 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;
box-shadow:0 12px 30px rgba(0,0,0,.34);backdrop-filter:blur(10px);
transition:transform .2s ease,border-color .2s ease,background .2s ease;-webkit-font-smoothing:antialiased}
.lt-voltar:hover{transform:translateY(-2px);border-color:#00d4d4;background:rgba(10,14,39,.98);color:#eaf0f7}
.lt-voltar:focus-visible{outline:3px solid #00d4d4;outline-offset:3px}
.lt-voltar__i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:999px;
background:rgba(0,212,212,.16);color:#00d4d4;font-size:14px}
@media (max-width:640px){.lt-voltar{left:12px;bottom:12px;padding:10px 13px;font-size:13px}
.lt-voltar__t{display:none}}
.lt-espaco{height:86px;flex:none;pointer-events:none}
@media print{.lt-voltar,.lt-espaco{display:none}}
</style>
<div class="lt-espaco" aria-hidden="true"></div>
<a class="lt-voltar" href="../../index.html" aria-label="Voltar ao catálogo UX Design">
  <span class="lt-voltar__i" aria-hidden="true">&#8592;</span>
  <span class="lt-voltar__t">Voltar ao portfólio</span>
</a>
<!-- fim · volta ao catálogo -->
</body>

</html>
