<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <title>Mensagens de bom dia · WhatsApp Messages</title>
  <link rel="stylesheet" href="../../shared/lt-base.css" />
  <link rel="stylesheet" href="../../shared/lt-feedback.css" />
  <script src="../../shared/lt-feedback.js"></script>
  <meta name="description" content="Layout do Sistema de mensagens do WhatsApp." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="WhatsApp Messages · UX Design" />
  <meta property="og:description" content="Layout do Sistema de mensagens do WhatsApp." />
  <meta property="og:url" content="https://douglasabnovato.github.io/ux-design/projects/whatsapp-messages/" />
  <meta property="og:image" content="https://douglasabnovato.github.io/ux-design/assets/whatsapp-messages.jpg" />
</head>
<body>
  <main class="app">
    <header class="app__topo">
      <h1>Mensagens de bom dia</h1>
      <p>Escolha uma mensagem pronta (ou escreva a sua), informe o número e envie pelo WhatsApp.</p>
    </header>
    <section aria-labelledby="lista-titulo">
      <h2 id="lista-titulo" class="lt-sr-only">Mensagens prontas</h2>
      <ul class="mensagens">
        <li><button type="button" class="mensagem" aria-pressed="false">
          <span class="mensagem__texto">Bom dia, luz do dia.</span>
          <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="" width="36" height="36">
        </button></li>
        <li><button type="button" class="mensagem" aria-pressed="false">
          <span class="mensagem__texto">Bom dia, minha princesa.</span>
          <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="" width="36" height="36">
        </button></li>
        <li><button type="button" class="mensagem" aria-pressed="false">
          <span class="mensagem__texto">Bom dia mãe!!</span>
          <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="" width="36" height="36">
        </button></li>
        <li><button type="button" class="mensagem" aria-pressed="false">
          <span class="mensagem__texto">Bom dia brother. Bora para pelada!?</span>
          <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="" width="36" height="36">
        </button></li>
        <li><button type="button" class="mensagem" aria-pressed="false">
          <span class="mensagem__texto">Bom dia brow. Bora tomar uma?!</span>
          <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="" width="36" height="36">
        </button></li>
        <li><button type="button" class="mensagem" aria-pressed="false">
          <span class="mensagem__texto">Bom dia brow. Qual a boa de hoje?</span>
          <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="" width="36" height="36">
        </button></li>
        <li><button type="button" class="mensagem" aria-pressed="false">
          <span class="mensagem__texto">Bom dia! Segundou. Foco no trabalho.</span>
          <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="" width="36" height="36">
        </button></li>
        <li><button type="button" class="mensagem" aria-pressed="false">
          <span class="mensagem__texto">Bom dia. Sextoou.</span>
          <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="" width="36" height="36">
        </button></li>
        <li><button type="button" class="mensagem" aria-pressed="false">
          <span class="mensagem__texto">Bom dia. Meio-dia. Quem fez, fez!!!</span>
          <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="" width="36" height="36">
        </button></li>
      </ul>
    </section>
    <form class="envio" id="form-envio" novalidate>
      <h2>Enviar mensagem</h2>
      <div class="campo">
        <label for="msg-texto">Mensagem</label>
        <textarea id="msg-texto" name="mensagem" rows="3" required minlength="3" placeholder="Toque em uma mensagem acima ou escreva aqui"></textarea>
      </div>
      <div class="campo">
        <label for="msg-numero">WhatsApp de destino (com DDD)</label>
        <input id="msg-numero" name="telefone" type="tel" inputmode="numeric" required autocomplete="off" placeholder="(32) 98836-7667">
      </div>
      <button type="submit" class="envio__botao">Enviar pelo WhatsApp</button>
      <div class="recentes" id="recentes" aria-live="polite"></div>
    </form>
  </main>
  <script type="text/javascript" src="main.js"></script>

box-shadow:0 12px 30px rgba(0,0,0,.34);backdrop-filter:blur(10px);
transition:transform .2s ease,border-color .2s ease,background .2s ease;-webkit-font-smoothing:antialiased}

  <span class="lt-voltar__i" aria-hidden="true">&#8592;</span>

</body>
</html>
