<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=1" />
    <meta name="description" content="Login Form">
    <meta name="keywords" content="HTML,CSS,JavaScript">
    <meta name="author" content="douglasabnovato">
    <link rel="shortcut icon" href="./assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./style.css">
    <title>Login</title>
  <link rel="stylesheet" href="../../shared/lt-base.css" />
  <link rel="stylesheet" href="../../shared/lt-feedback.css" />
  <style>:root{--lt-cor:#ffc632;--lt-texto-sobre-cor:#161616}.dica-demo{margin:10px 0 0;padding:8px 12px;border-radius:6px;background:rgba(255,198,50,.1);color:#e1e1e6;font-size:.85rem}.lt-sucesso{color:#e1e1e6}.lt-sucesso__texto{color:#b3b3b3}</style>
  <script src="../../shared/lt-feedback.js"></script>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Login Form · UX Design" />
  <meta property="og:description" content="Formulário de login para acesso à plataforma com design encantador." />
  <meta property="og:url" content="https://douglasabnovato.github.io/ux-design/projects/login-form/" />
  <meta property="og:image" content="https://douglasabnovato.github.io/ux-design/assets/login-form.jpg" />
</head>

<body>
    <h1 class="lt-sr-only">Login da plataforma</h1>
    <div class="form-wrapper">
        <div class="form-container">
            <div class="form-left">
                <div class="header">
                    <img src="./assets/logo.svg" alt="Camp.in">
                </div>
                <div class="form-box">
                    <div class="form-title">
                        <h2>
                            <img src="./assets/log-in.svg" alt="">Faça seu login
                        </h2>
                        <p class="form-description">Entre com suas informações de cadastro.</p>
                        <p class="dica-demo">Para testar, use <strong>demo@uxdesign.com</strong> e a senha <strong>demo123</strong>.</p>
                    </div>
                    <form action="" novalidate>
                        <div class="email">
                            <label class="email_lab" id="email_lab" for="email_inp">
                                E-mail
                            </label>
                            <div>
                                <input class="email_inp" id="email_inp" name="email_inp" type="email" value="" size="8"
                                    autocomplete="email" required placeholder="Digite seu e-mail">
                            </div>
                        </div>
                        <div class="password">
                            <label class="password_lab" id="password_lab" for="password_inp">
                                Senha
                            </label>
                            <div class="input_password">
                                <input class="password_inp" id="password_inp" name="password_inp" type="password"
                                    value="" size="8" autocomplete="current-password" minlength="6" required placeholder="Digite sua senha">
                                <img class="eye_password_inp" id="toggle_password" src="./assets/eye-slash.svg" alt="Mostrar senha" role="button" tabindex="0">
                            </div>
                        </div>
                        <div class="lembrete">
                            <div class="lembrei">
                                <input class="lembrete_inp" id="lembrete_inp" name="lembrete_inp" type="checkbox"
                                    value="lembrar">
                                <label class="lembrete_lab" for="lembrete_inp">Lembre-me</label>
                            </div>
                            <div class="esqueci">
                                <a href="#" id="esqueci-senha">Esqueci minha senha</a>
                            </div>
                        </div>
                        <div class="entrar">
                            <input class="entrar" id="entrar" name="entrar" type="submit" value="Entrar">
                        </div>
                        <div class="registrar_conta">
                            <span class="texto">Não tem uma conta?</span>
                            <a class="register" href="#" id="registrar">Registre-se</a>
                        </div>
                    </form>
                </div>
            </div>
            <div class="form-right">
                <div class="content">
                    <div class="titulo">Bem-vindo, dev</div>
                    <p class="subtitulo">Aprenda programação no seu ritmo</p>
                </div>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
<!-- learnTECH · volta ao catálogo UX Design -->
<style>
.lt-voltar{position:fixed;left:18px;bottom:18px;z-index:99998;display:inline-flex;align-items:center;gap:9px;
padding:11px 16px;border-radius:999px;background:rgba(10,14,39,.92);border:1px solid rgba(0,212,212,.42);
color:#eaf0f7;text-decoration:none;font:700 14px/1 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;
box-shadow:0 12px 30px rgba(0,0,0,.34);backdrop-filter:blur(10px);
transition:transform .2s ease,border-color .2s ease,background .2s ease;-webkit-font-smoothing:antialiased}
.lt-voltar:hover{transform:translateY(-2px);border-color:#00d4d4;background:rgba(10,14,39,.98);color:#eaf0f7}
.lt-voltar:focus-visible{outline:3px solid #00d4d4;outline-offset:3px}
.lt-voltar__i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:999px;
background:rgba(0,212,212,.16);color:#00d4d4;font-size:14px}

<a class="lt-voltar" href="../../index.html" aria-label="Voltar ao catálogo UX Design">
  <span class="lt-voltar__i" aria-hidden="true">&#8592;</span>
  <span class="lt-voltar__t">Voltar ao portfólio</span>
</a>

</body>

</html>
