<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto 3D ABC</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="premium-shell">
      <section class="premium-card">
        <div class="premium-hero">
          <span class="eyebrow">Orçamento 3D</span>
          <h1>Solicite sua especificação 3D com foco em obra e acabamento</h1>
          <p>Detalhe sua necessidade e receba uma proposta técnica para projeto digital e execução.</p>
        </div>

        <form id="project3DForm" novalidate>
          <div class="field-grid">
            <label>
              Nome completo
              <input type="text" name="name" required />
            </label>
            <label>
              E-mail
              <input type="email" name="email" required />
            </label>
            <label>
              WhatsApp
              <input type="tel" name="whatsapp" required />
            </label>
          </div>

          <div class="field-grid">
            <label>
              Tipo de projeto
              <select name="projectType" required>
                <option value="">Selecione</option>
                <option value="residencial">Residencial</option>
                <option value="comercial">Comercial</option>
                <option value="industrial">Industrial</option>
              </select>
            </label>
            <label>
              Número de ambientes
              <select name="environments" required>
                <option value="">Selecione</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4+">4 ou mais</option>
              </select>
            </label>
          </div>

          <label class="textarea-group">
            Descreva sua demanda
            <textarea name="brief" rows="5" placeholder="Ex: projeto de fachada, reforma de cozinha, maquete 3D" required></textarea>
          </label>

          <div class="premium-checklist">
            <p>Serviços desejados</p>
            <label class="checkbox-card"><input type="checkbox" name="services" value="layout3d" /> Layout 3D</label>
            <label class="checkbox-card"><input type="checkbox" name="services" value="orcamento" /> Orçamento detalhado</label>
            <label class="checkbox-card"><input type="checkbox" name="services" value="acompanhamento" /> Acompanhamento técnico</label>
          </div>

          <label class="optin-label">
            <input type="checkbox" name="subscribe" required />
            Concordo em receber comunicação por e-mail, SMS ou WhatsApp.
          </label>

          <button type="submit" class="cta-button">Enviar pedido</button>
          <div id="project3DMessage" class="form-message" aria-live="polite"></div>
        </form>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
