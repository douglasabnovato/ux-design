<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Solicitação de projeto 3D: briefing da demanda, tipo de projeto, número de ambientes e serviços adicionais.">
    <title>Pedido de Projeto 3D</title>
    <link rel="stylesheet" href="./style.css" />
  <style>
/* Erros de campo e resumo do lead — injetado com o motor de captação */
.campo-erro{display:block;margin-top:6px;font-size:.82rem;font-weight:600;color:#ff6b6b;line-height:1.35}
[aria-invalid="true"]{border-color:#ff6b6b !important;outline-color:#ff6b6b}
.resumo-lead{margin:10px 0;padding:12px 14px;border-radius:10px;background:rgba(0,0,0,.16);
border:1px solid rgba(127,127,127,.28);font:400 .84rem/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto}
.resumo-copiar{padding:9px 16px;border-radius:999px;border:1px solid currentColor;background:transparent;
color:inherit;font:700 .84rem/1 inherit;cursor:pointer}
.resumo-copiar:hover{opacity:.78}
</style>
</head>
  <body>
    <main class="premium-shell">
      <section class="premium-card">
        <div class="premium-hero">
          <span class="eyebrow">Projeto 3D</span>
          <h1>Garanta sua proposta de projeto digital</h1>
          <p>Preencha o formulário e receba análise técnica, sugestões de layout e estimativa de projeto.</p>
        </div>

        <form id="premiumForm" class="premium-form" novalidate>
          <div class="field-grid">
            <label>
              Nome completo
              <input type="text" name="name" placeholder="Seu nome" required / autocomplete="name">
            </label>
            <label>
              E-mail
              <input type="email" name="email" placeholder="seu@email.com" required / autocomplete="email">
            </label>
            <label>
              Telefone
              <input type="tel" name="phone" placeholder="(00) 00000-0000" required / autocomplete="tel" inputmode="tel">
            </label>
          </div>

          <div class="field-grid">
            <label>
              Tipo de projeto
              <select name="projectType" required>
                <option value="">Selecione</option>
                <option value="residencial">Residencial</option>
                <option value="comercial">Comercial</option>
                <option value="industrial">Industrial</option>
              </select>
            </label>
            <label>
              Ambientes
              <select name="environments" required>
                <option value="">Selecione</option>
                <option value="1">1 ambiente</option>
                <option value="2">2 ambientes</option>
                <option value="3">3 ambientes</option>
                <option value="4+">4 ou mais</option>
              </select>
            </label>
          </div>

          <div class="premium-checklist">
            <p>Serviços desejados</p>
            <label class="checkbox-card"><input type="checkbox" name="service" value="layout" /> Layout 3D</label>
            <label class="checkbox-card"><input type="checkbox" name="service" value="orcamento" /> Orçamento detalhado</label>
            <label class="checkbox-card"><input type="checkbox" name="service" value="implantacao" /> Implantação técnica</label>
          </div>

          <label class="textarea-group">
            Conte mais sobre sua demanda
            <textarea name="brief" rows="5" placeholder="Ex: reforma de cozinha, projeto de fachada ou espaço comercial" required></textarea>
          </label>

          <label class="optin-label">
            <input type="checkbox" name="subscribe" required />
            Concordo em receber comunicação por e-mail, SMS ou WhatsApp.
          </label>

          <button type="submit" class="cta-button">Enviar pedido</button>
          <div id="premiumMessage" class="form-message" aria-live="polite"></div>
        </form>
      </section>
    </main>

    <script src="./script.js"></script>
  <!-- learnTECH · volta ao catálogo UX Design -->
<style>

padding:11px 16px;border-radius:999px;background:rgba(10,14,39,.92);border:1px solid rgba(0,212,212,.42);
color:#eaf0f7;text-decoration:none;font:700 14px/1 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;
box-shadow:0 12px 30px rgba(0,0,0,.34);backdrop-filter:blur(10px);
transition:transform .2s ease,border-color .2s ease,background .2s ease;-webkit-font-smoothing:antialiased}

</body>
</html>
