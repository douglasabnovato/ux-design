<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="shortcut icon" href="./assets/profile.svg" type="image/x-icon">
    <title>Rocket Card · cartão de perfil GitHub</title>
  <link rel="stylesheet" href="../../shared/lt-base.css" />
  <link rel="stylesheet" href="../../shared/lt-feedback.css" />
  <script src="../../shared/lt-feedback.js"></script>
  <meta name="description" content="Página de cartão de visita com design encantador." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Rocket Card · UX Design" />
  <meta property="og:description" content="Página de cartão de visita com design encantador." />
  <meta property="og:url" content="https://douglasabnovato.github.io/ux-design/projects/rocket-card/" />
  <meta property="og:image" content="https://douglasabnovato.github.io/ux-design/assets/rocket-card.jpg" />
    <style>
        .busca-dev { width: min(360px, 92vw); margin: 0 auto 20px; font-family: inherit; color: #fff; }
        .busca-dev label { display: block; font-weight: 700; margin-bottom: 6px; }
        .busca-dev__linha { display: flex; gap: 8px; }
        .busca-dev input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 8px; border: 0; font: inherit; }
        .busca-dev button { padding: 10px 14px; border-radius: 8px; border: 0; background: #04d361; color: #121214; font-weight: 700; cursor: pointer; }
        .busca-dev__status { min-height: 1.3em; font-size: .85rem; margin-top: 6px; }
        h1.titulo { margin: 0; font-size: inherit; font-weight: inherit; }
        .box { height: auto !important; min-height: 693px; width: min(438px, 96vw) !important; padding-bottom: 1.5rem; }
        .busca-dev { width: min(360px, 86%); }
        button.footer { border: 0; font: inherit; color: inherit; cursor: pointer; }
        .card[aria-busy="true"] { opacity: .55; transition: opacity .2s; }
    </style>
</head>

<body>
    <div class="box">
        <form class="busca-dev" id="form-dev" novalidate>
            <label for="dev-usuario">Usuário do GitHub</label>
            <div class="busca-dev__linha">
                <input id="dev-usuario" name="usuario" required pattern="[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})" value="douglasabnovato" autocomplete="off" spellcheck="false" />
                <button type="submit">Gerar cartão</button>
            </div>
            <p class="busca-dev__status" id="dev-status" role="status"></p>
        </form>
        <div class="card" aria-live="polite" aria-busy="false">

            <div class="header">
                <div class="img-header">
                    <img src="./assets/profile.svg" alt="" srcset="">
                </div>
                <h1 class="titulo">usuário</h1>
            </div>

            <div class="profile">
                <div class="image-profile" role="img" aria-label="Foto de perfil"></div> 
            </div>

            <div class="contacts">
                <ul>
                    <li class="following">
                        <span><img src="./assets/following.svg" alt="" srcset=""></span>
                        <span class="num_following" style="margin-right: 5px;">following</span>
                        <span>Seguindo</span>
                    </li>
                    <li class="followers">
                        <span><img src="./assets/followers.svg" alt="" srcset=""></span>
                        <span class="num_followers" style="margin-right: 5px;">followers</span>
                        <span>Seguidores</span>
                    </li>
                    <li class="repository">
                        <span><img src="./assets/repository.svg" alt="" srcset=""></span>
                        <span class="public_repos" style="margin-right: 5px;">repository</span>
                        <span>Repositórios</span>
                    </li>
                    <li class="company">
                        <span><img src="./assets/company.svg" alt="" srcset=""></span>
                        <span class="nam_company">company</span>
                    </li>
                    <li class="location">
                        <span><img src="./assets/location.svg" alt="" srcset=""></span>
                        <span class="lo_location">location</span>
                    </li>
                </ul>
            </div>

            <div class="det">
                <button type="button" id="footer" class="footer" aria-label="Trocar a cor de fundo do cartão">
                    <span class="img-footer">
                        <img src="./assets/profile.svg" alt="" srcset="">
                    </span>
                    <span>DEVELOPER</span>
                </button>
            </div>

        </div>
    </div>
    <script src="./script.js"></script>
<!-- learnTECH · volta ao catálogo UX Design -->
<style>
.lt-voltar{position:fixed;left:18px;bottom:18px;z-index:99998;display:inline-flex;align-items:center;gap:9px;
padding:11px 16px;border-radius:999px;background:rgba(10,14,39,.92);border:1px solid rgba(0,212,212,.42);
color:#eaf0f7;text-decoration:none;font:700 14px/1 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;
box-shadow:0 12px 30px rgba(0,0,0,.34);backdrop-filter:blur(10px);
transition:transform .2s ease,border-color .2s ease,background .2s ease;-webkit-font-smoothing:antialiased}
.lt-voltar:hover{transform:translateY(-2px);border-color:#00d4d4;background:rgba(10,14,39,.98);color:#eaf0f7}
.lt-voltar:focus-visible{outline:3px solid #00d4d4;outline-offset:3px}
.lt-voltar__i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:999px;
background:rgba(0,212,212,.16);color:#00d4d4;font-size:14px}
@media (max-width:640px){.lt-voltar{left:12px;bottom:12px;padding:10px 13px;font-size:13px}
.lt-voltar__t{display:none}}
.lt-espaco{height:86px;flex:none;pointer-events:none}
@media print{.lt-voltar,.lt-espaco{display:none}}
</style>
<div class="lt-espaco" aria-hidden="true"></div>
<a class="lt-voltar" href="../../index.html" aria-label="Voltar ao catálogo UX Design">
  <span class="lt-voltar__i" aria-hidden="true">&#8592;</span>
  <span class="lt-voltar__t">Voltar ao portfólio</span>
</a>
<!-- fim · volta ao catálogo -->
</body>

</html>
