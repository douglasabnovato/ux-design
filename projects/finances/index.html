<html lang="pt-BR">

        <meta charset="utf-8">

        <meta name="description" content="website de controle financeiro">
        <link rel="stylesheet" href="./style.css"> 
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,400;0,700;1,100;1,400;1,700&display=swap">

        <title>dev.finance$</title>
      <link rel="stylesheet" href="../../shared/lt-base.css" />
  <link rel="stylesheet" href="../../shared/lt-feedback.css" />
  <style>:root{--lt-cor:#2d4a22}</style>
  <script src="../../shared/lt-feedback.js"></script>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="dev.finances · UX Design" />
  <meta property="og:description" content="Aplicação web de controle financeiro pessoal (entradas, saídas e saldo) construída durante a Maratona Discover, com roteiro completo de mentoria e soft/hard skills." />
  <meta property="og:url" content="https://douglasabnovato.github.io/ux-design/projects/finances/" />
  <meta property="og:image" content="https://douglasabnovato.github.io/ux-design/assets/finances.jpg" />
</head>
    <body>
    <h1 class="lt-sr-only">dev.finances: controle de entradas e saídas</h1> 
        <header> 
            <img src="./assets/logo.svg" alt="Logo Dev Finance">
        </header> 
        <main class="container"> 
            <section id="balance">
                <h2 class="sr-only">Balanço</h2>
                <div class="card">
                    <h3>
                        <span>Entradas</span>
                        <img src="./assets/income.svg" alt="Image de Entradas">
                    </h3>
                    <p id="income-display">R$ 0,00</p>
                </div> 
                <div class="card">
                    <h3>
                        <span>Saídas</span>
                        <img src="./assets/expense.svg" alt="Image de Saídas">
                    </h3> 
                    <p id="expense-display">R$ 0,00</p>     
                </div> 
                <div class="card total">
                    <h3>
                        <span>Total</span>
                        <img src="./assets/total.svg" alt="Image de Total">
                    </h3> 
                    <p id="total-display">R$ 0,00</p>
                </div>
            </section> 
            <section  id="transaction">
                <h2 class="sr-only">Transações</h2>
                <a  href="#" 
                    onclick="event.preventDefault(); Modal.open()" 
                    class="button new">+ Nova Transação</a>
                <table id="data-table">
                    <thead> 
                        <tr>
                            <th>Descrição</th>
                            <th>Valor</th>
                            <th>Datas</th> 
                            <th></th> 
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section> 
        </main> 
        <div class="modal-overlay">
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-nova-transacao">
                <div id="form" onsubmit="Form.submit(event)">
                    <h2 id="titulo-nova-transacao">Nova Transação</h2>
                    <form action="" novalidate>
                        <div class="input-group">
                            <label 
                                class="sr-only" 
                                for="description">Descrição</label>
                            <input 
                                type="text"
                                id="description"
                                name="description"
                                placeholder="Descrição"
                                minlength="3"
                                required
                            />
                        </div>
                        <div class="input-group">
                            <label 
                                class="sr-only" 
                                for="amount">Valor</label>
                            <input 
                                type="number"
                                step="0.01"
                                id="amount"
                                name="amount"
                                placeholder="0.00"
                                required
                            />
                            <small class="help">Use o sinal negativo para despesas e vírgula para casas decimais.</small>
                        </div>
                        <div class="input-group">
                            <label 
                                class="sr-only" 
                                for="date">Data</label>
                            <input 
                                type="date"
                                id="date"
                                name="date" 
                                required
                            />
                        </div>
                        <div class="input-group actions">
                            <a href="#" onclick="event.preventDefault(); Modal.close()" class="button cancel">Cancelar</a>
                            <button>Salvar</button>
                        </div>
                    </form>
                </div> 
            </div>
        </div> 
        <footer>
            <p>dev.finance$</p> 
        </footer> 
        <script src="./scripts.js"></script>
