<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Formulário em etapas para qualificar a demanda de reforma: empresa, localização, área de atuação e estágio da obra.">
    <title>Orçamento Técnico ABC</title>
    <link rel="stylesheet" href="./style.css" />
  <style>
/* Erros de campo e resumo do lead — injetado com o motor de captação */
.campo-erro{display:block;margin-top:6px;font-size:.82rem;font-weight:600;color:#ff6b6b;line-height:1.35}
[aria-invalid="true"]{border-color:#ff6b6b !important;outline-color:#ff6b6b}
.resumo-lead{margin:10px 0;padding:12px 14px;border-radius:10px;background:rgba(0,0,0,.16);
border:1px solid rgba(127,127,127,.28);font:400 .84rem/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto}
.resumo-copiar{padding:9px 16px;border-radius:999px;border:1px solid currentColor;background:transparent;
color:inherit;font:700 .84rem/1 inherit;cursor:pointer}
.resumo-copiar:hover{opacity:.78}
</style>
</head>
  <body>
    <main class="wizard-shell">
      <section class="wizard-card">
        <header class="wizard-header">
          <span class="eyebrow">Orçamento Técnico</span>
          <h1>Solicite a avaliação de obra em dois passos</h1>
          <p>Preencha as informações básicas e detalhe o projeto para receber uma proposta precisa.</p>
        </header>

        <div class="wizard-steps">
          <div class="step active"><span>1</span><p>Dados</p></div>
          <div class="step"><span>2</span><p>Obra</p></div>
        </div>

        <div id="wizardMessage" class="wizard-message" aria-live="polite"></div>

        <form id="wizardForm" novalidate>
          <fieldset class="wizard-page active" data-step="1">
            <legend>Dados da Empresa</legend>
            <div class="field-grid">
              <label>
                Razão social
                <input type="text" name="company" required / autocomplete="organization">
              </label>
              <label>
                CNPJ
                <input type="text" name="cnpj" required / inputmode="numeric">
              </label>
              <label>
                Responsável
                <input type="text" name="owner" required / autocomplete="name">
              </label>
            </div>
          </fieldset>

          <fieldset class="wizard-page" data-step="2">
            <legend>Informações da Obra</legend>
            <div class="field-grid">
              <label>
                Estado
                <select name="state" required>
                  <option value="">Selecione</option>
                  <option value="SP">São Paulo</option>
                  <option value="MG">Minas Gerais</option>
                  <option value="RJ">Rio de Janeiro</option>
                  <option value="BA">Bahia</option>
                </select>
              </label>
              <label>
                Cidade
                <input type="text" name="city" required / autocomplete="address-level2">
              </label>
              <label>
                Área construída
                <select name="area" required>
                  <option value="">Selecione</option>
                  <option value="ate1000">Até 1.000 m²</option>
                  <option value="1000a3000">1.000 a 3.000 m²</option>
                </select>
              </label>
              <label>
                Estágio da obra
                <select name="stage" required>
                  <option value="">Selecione</option>
                  <option value="fundacao">Fundação</option>
                  <option value="alvenaria">Alvenaria</option>
                  <option value="acabamento">Acabamento</option>
                </select>
              </label>
              <label class="textarea-group">
                Descreva o principal objetivo
                <textarea name="objective" rows="4" required placeholder="Ex: necessidade de projeto, prazo de entrega ou avaliação de instalações"></textarea>
              </label>
            </div>
          </fieldset>

          <div class="wizard-actions">
            <button type="button" id="prevBtn" class="secondary-button" disabled>Voltar</button>
            <button type="button" id="nextBtn" class="primary-button">Próximo</button>
          </div>
        </form>
      </section>
    </main>

    <script src="./script.js"></script>
  <!-- learnTECH · volta ao catálogo UX Design -->
<style>
.lt-voltar{position:fixed;left:18px;bottom:18px;z-index:99998;display:inline-flex;align-items:center;gap:9px;
padding:11px 16px;border-radius:999px;background:rgba(10,14,39,.92);border:1px solid rgba(0,212,212,.42);
color:#eaf0f7;text-decoration:none;font:700 14px/1 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;
box-shadow:0 12px 30px rgba(0,0,0,.34);backdrop-filter:blur(10px);
transition:transform .2s ease,border-color .2s ease,background .2s ease;-webkit-font-smoothing:antialiased}
.lt-voltar:hover{transform:translateY(-2px);border-color:#00d4d4;background:rgba(10,14,39,.98);color:#eaf0f7}
.lt-voltar:focus-visible{outline:3px solid #00d4d4;outline-offset:3px}
.lt-voltar__i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:999px;
background:rgba(0,212,212,.16);color:#00d4d4;font-size:14px}
@media (max-width:640px){.lt-voltar{left:12px;bottom:12px;padding:10px 13px;font-size:13px}
.lt-voltar__t{display:none}}
.lt-espaco{height:86px;flex:none;pointer-events:none}
@media print{.lt-voltar,.lt-espaco{display:none}}
</style>
<div class="lt-espaco" aria-hidden="true"></div>
<a class="lt-voltar" href="../../index.html" aria-label="Voltar ao catálogo UX Design">
  <span class="lt-voltar__i" aria-hidden="true">&#8592;</span>
  <span class="lt-voltar__t">Voltar ao portfólio</span>
</a>
<!-- fim · volta ao catálogo -->
</body>
</html>
