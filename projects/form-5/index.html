<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orçamento Técnico ABC</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="wizard-shell">
      <section class="wizard-card">
        <header class="wizard-header">
          <span class="eyebrow">Orçamento Técnico</span>
          <h1>Solicite a avaliação de obra em dois passos</h1>
          <p>Preencha as informações básicas e detalhe o projeto para receber uma proposta precisa.</p>
        </header>

        <div class="wizard-steps">
          <div class="step active"><span>1</span><p>Dados</p></div>
          <div class="step"><span>2</span><p>Obra</p></div>
        </div>

        <div id="wizardMessage" class="wizard-message" aria-live="polite"></div>

        <form id="wizardForm" novalidate>
          <fieldset class="wizard-page active" data-step="1">
            <legend>Dados da Empresa</legend>
            <div class="field-grid">
              <label>
                Razão social
                <input type="text" name="company" required />
              </label>
              <label>
                CNPJ
                <input type="text" name="cnpj" required />
              </label>
              <label>
                Responsável
                <input type="text" name="owner" required />
              </label>
            </div>
          </fieldset>

          <fieldset class="wizard-page" data-step="2">
            <legend>Informações da Obra</legend>
            <div class="field-grid">
              <label>
                Estado
                <select name="state" required>
                  <option value="">Selecione</option>
                  <option value="SP">São Paulo</option>
                  <option value="MG">Minas Gerais</option>
                  <option value="RJ">Rio de Janeiro</option>
                  <option value="BA">Bahia</option>
                </select>
              </label>
              <label>
                Cidade
                <input type="text" name="city" required />
              </label>
              <label>
                Área construída
                <select name="area" required>
                  <option value="">Selecione</option>
                  <option value="ate1000">Até 1.000 m²</option>
                  <option value="1000a3000">1.000 a 3.000 m²</option>
                </select>
              </label>
              <label>
                Estágio da obra
                <select name="stage" required>
                  <option value="">Selecione</option>
                  <option value="fundacao">Fundação</option>
                  <option value="alvenaria">Alvenaria</option>
                  <option value="acabamento">Acabamento</option>
                </select>
              </label>
              <label class="textarea-group">
                Descreva o principal objetivo
                <textarea name="objective" rows="4" required placeholder="Ex: necessidade de projeto, prazo de entrega ou avaliação de instalações"></textarea>
              </label>
            </div>
          </fieldset>

          <div class="wizard-actions">
            <button type="button" id="prevBtn" class="secondary-button" disabled>Voltar</button>
            <button type="button" id="nextBtn" class="primary-button">Próximo</button>
          </div>
        </form>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
