<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Captura de lead com contato, documento, canal de atendimento e briefing da experiência do cliente.">
    <title>Formulário de Contato ABC</title>
    <link rel="stylesheet" href="./style.css" />
  <style>
/* Erros de campo e resumo do lead — injetado com o motor de captação */
.campo-erro{display:block;margin-top:6px;font-size:.82rem;font-weight:600;color:#ff6b6b;line-height:1.35}
[aria-invalid="true"]{border-color:#ff6b6b !important;outline-color:#ff6b6b}
.resumo-lead{margin:10px 0;padding:12px 14px;border-radius:10px;background:rgba(0,0,0,.16);
border:1px solid rgba(127,127,127,.28);font:400 .84rem/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto}
.resumo-copiar{padding:9px 16px;border-radius:999px;border:1px solid currentColor;background:transparent;
color:inherit;font:700 .84rem/1 inherit;cursor:pointer}
.resumo-copiar:hover{opacity:.78}
</style>
</head>
  <body>
    <main class="form-shell">
      <section class="form-card">
        <header class="form-head">
          <span class="eyebrow">Lead Qualificado</span>
          <h1>Solicite sugestões e faça seu projeto avançar</h1>
          <p>Preencha os dados e receba contato de um consultor da ABC da Construção.</p>
        </header>

        <form id="leadForm" novalidate>
          <fieldset>
            <legend>Informações de contato</legend>
            <div class="grid-2">
              <label>
                Nome completo
                <input type="text" name="name" placeholder="Seu nome" required / autocomplete="name">
              </label>
              <label>
                E-mail
                <input type="email" name="email" placeholder="seu@email.com" required / autocomplete="email">
              </label>
            </div>
            <div class="grid-2">
              <label>
                CPF
                <input type="text" name="cpf" placeholder="00000000000" required pattern="[0-9]{11}" / inputmode="numeric">
              </label>
              <label>
                Telefone (WhatsApp)
                <input type="tel" name="phone" placeholder="(00) 00000-0000" required / autocomplete="tel" inputmode="tel">
              </label>
            </div>
          </fieldset>

          <fieldset>
            <legend>Detalhes do projeto</legend>
            <div class="grid-2">
              <label>
                Guide Shop
                <select name="guideshop" required>
                  <option value="">Selecione</option>
                  <option value="novalima">BH - Nova Lima</option>
                  <option value="matriz">JF - Matriz</option>
                  <option value="paecambu">SP - Paecambu</option>
                  <option value="santacruz">RS - Santa Cruz</option>
                </select>
              </label>
              <label>
                Tipo de atendimento
                <select name="service" required>
                  <option value="">Selecione</option>
                  <option value="catalogo">Catálogo ABC</option>
                  <option value="orcamento">Orçamento</option>
                  <option value="projeto3d">Projeto 3D</option>
                </select>
              </label>
            </div>
            <label class="textarea-group">
              Conte-nos sua experiência
              <textarea name="experience" rows="4" placeholder="Ex: já trabalho com acabamento, busco orientação de reforma..." required></textarea>
            </label>
          </fieldset>

          <div class="form-actions">
            <button type="submit" class="cta-button">Enviar solicitação</button>
          </div>
          <p class="privacy-notice">
            * Não compartilhamos seus dados com terceiros.
          </p>
          <div id="leadMessage" class="form-message" aria-live="polite"></div>
        </form>
      </section>
    </main>

    <script src="./script.js"></script>
  <!-- learnTECH · volta ao catálogo UX Design -->
<style>

color:#eaf0f7;text-decoration:none;font:700 14px/1 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;
box-shadow:0 12px 30px rgba(0,0,0,.34);backdrop-filter:blur(10px);
transition:transform .2s ease,border-color .2s ease,background .2s ease;-webkit-font-smoothing:antialiased}

</body>
</html>
