<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/logo.jpg" type="image/x-icon">
    <title>Hamburguers Mágicos | Cardápio Digital</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Montserrat:wght@700;800&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../../shared/lt-base.css" />
  <link rel="stylesheet" href="../../shared/lt-feedback.css" />
  <style>:root{--lt-cor:#ffc107;--lt-texto-sobre-cor:#111;--lt-fundo:#141414;--lt-texto:#f5f5f5;--lt-suave:#b5b5b5;--lt-borda:rgba(255,255,255,.14)}</style>
  <script src="../../shared/lt-feedback.js"></script>
  <meta name="description" content="Landing page de uma hamburgueria, com cardápio digital e pedido online." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Hamburguers Mágicos · UX Design" />
  <meta property="og:description" content="Landing page de uma hamburgueria, com cardápio digital e pedido online." />
  <meta property="og:url" content="https://douglasabnovato.github.io/ux-design/projects/hamburgueria/" />
  <meta property="og:image" content="https://douglasabnovato.github.io/ux-design/assets/hamburguers-magicos.jpg" />
</head>
<body>

    <header>
        <nav class="nav-container">
            <div class="header-logo">
                <img src="./assets/hamburguer-00.jpg" alt="Logo Hamburguers Mágicos">
                <div class="logo-name">
                    <span>Hamburguers</span>
                    <span>Mágicos</span>
                </div>
            </div>
            
            <div class="cart-status" onclick="openCart()">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count">0</span>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Onde a tecnologia encontra o <span>sabor.</span></h1>
            <p>Escolha seu blend favorito e experimente a magia.</p>
        </section>

        <section id="category-filter-container" class="filters-wrapper">
            </section>

        <section class="hamburguers" id="products-grid">
            <div class="loader">Carregando magia...</div>
        </section>
    </main>

    <div id="sticky-checkout" class="sticky-footer hidden">
        <div class="footer-content">
            <div class="total-info">
                <span>Seu Pedido</span>
                <strong id="footer-total">R$ 0,00</strong>
            </div>
            <button class="btn-finish">Ver Sacola <i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
<!-- learnTECH · volta ao catálogo UX Design -->
<style>
.lt-voltar{position:fixed;left:18px;bottom:18px;z-index:99998;display:inline-flex;align-items:center;gap:9px;
padding:11px 16px;border-radius:999px;background:rgba(10,14,39,.92);border:1px solid rgba(0,212,212,.42);
color:#eaf0f7;text-decoration:none;font:700 14px/1 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;
box-shadow:0 12px 30px rgba(0,0,0,.34);backdrop-filter:blur(10px);
transition:transform .2s ease,border-color .2s ease,background .2s ease;-webkit-font-smoothing:antialiased}
.lt-voltar:hover{transform:translateY(-2px);border-color:#00d4d4;background:rgba(10,14,39,.98);color:#eaf0f7}
.lt-voltar:focus-visible{outline:3px solid #00d4d4;outline-offset:3px}
.lt-voltar__i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:999px;
background:rgba(0,212,212,.16);color:#00d4d4;font-size:14px}
@media (max-width:640px){.lt-voltar{left:12px;bottom:12px;padding:10px 13px;font-size:13px}
.lt-voltar__t{display:none}}
.lt-espaco{height:86px;flex:none;pointer-events:none}
@media print{.lt-voltar,.lt-espaco{display:none}}
</style>
<div class="lt-espaco" aria-hidden="true"></div>
<a class="lt-voltar" href="../../index.html" aria-label="Voltar ao catálogo UX Design">
  <span class="lt-voltar__i" aria-hidden="true">&#8592;</span>
  <span class="lt-voltar__t">Voltar ao portfólio</span>
</a>
<!-- fim · volta ao catálogo -->
</body>
</html>
