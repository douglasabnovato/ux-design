<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
    <style>
      :host {
        --destaque: #e5e5e5;
        --fonte: "Satoshi-Variable", sans-serif;
        --background-light: #ebf0f4;
        --neutral-dark: #333333;
        display: block;
        box-sizing: border-box;
      }

      @font-face {
        font-family: "Satoshi-Variable";
        src: url("sfsites/c/resource/FontSatoshi/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Variable.woff2")
            format("woff2"),
          url("sfsites/c/resource/FontSatoshi/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Variable.woff")
            format("woff"),
          url("sfsites/c/resource/FontSatoshi/Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Variable.ttf")
            format("truetype");
        font-weight: 300 900;
        font-display: swap;
        font-style: normal;
      }

      * {
        font-family: var(--fonte);
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        outline: none;
        border: none;
        list-style: none;
        text-decoration: none;
      }

      a {
        all: unset;
        color: inherit;
        text-decoration: none !important;
        cursor: pointer;
      }

      input:-webkit-autofill,
      select:-webkit-autofill {
        -webkit-box-shadow: 0 0 0 1000px white inset !important;
        -webkit-text-fill-color: #333 !important;
        background-color: white !important;
        caret-color: #333 !important;
        transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out;
      }

      input:-webkit-autofill:hover,
      select:-webkit-autofill:hover,
      input:-webkit-autofill:active,
      select:-webkit-autofill:active,
      input:-webkit-autofill:focus,
      select:-webkit-autofill:focus,
      input:-webkit-autofill:valid,
      select:-webkit-autofill:valid {
        -webkit-box-shadow: 0 0 0 1000px white inset !important;
        -webkit-text-fill-color: #333 !important;
        background-color: white !important;
        caret-color: #333 !important;
      }

      select {
        font-size: 16px;
        font-weight: normal;
        color: #000 !important;
        border-radius: 8px;
        background-color: #fff !important;
        padding: 10px;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        cursor: pointer;
        width: 100%;
        padding-right: 30px;
        border: 1px solid #ccc;
      }

      /* setinha no select */
      .select-custom {
        position: relative;
        display: inline-block;
        width: 100%;
      }

      .select-custom::after {
        content: "▼";
        /* Ícone da setinha */
        font-size: 9px;
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
      }

      option {
        background-color: #fff !important;
        color: #000 !important;
        font-size: 14px;
        border: none;
      }

      option:hover {
        background-color: #525252 !important;
        color: #fff !important;
        font-weight: bold !important;
      }

      option:checked {
        background-color: #fff !important;
        color: #000 !important;
      }

      select:focus {
        background-color: #fff !important;
        outline: none;
        box-shadow: 0 0 0 2px #333 !important;
      }

      select::-webkit-scrollbar {
        width: 8px;
        background-color: transparent;
      }

      select::-webkit-scrollbar-thumb {
        background-color: #333 !important;
        border-radius: 12px;
        border: 2px solid transparent;
      }

      select::-webkit-scrollbar-thumb:hover {
        background-color: #333 !important;
      }

      select::-webkit-scrollbar-track {
        background-color: transparent;
      }

      .label-input-row {
        -webkit-appearance: none;
        display: flex;
        gap: 10px;
        width: 100%;
      }

      .label-input {
        -webkit-appearance: none;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        width: 100%;
      }

      .label-input label {
        -webkit-appearance: none;
        color: #676767;
        font-size: 12px;
        font-style: normal;
        font-weight: 500;
        width: 100%;
        text-align: left;
      }

      /* Estilo padrão do input */
      .label-input input {
        -webkit-appearance: none;
        all: unset;
        display: flex;
        height: 48px;
        padding: 0px 16px;
        align-items: center;
        gap: 4px;
        width: 100%;
        border-radius: 6px;
        background: #fff;
        border: 2px solid transparent;
        color: var(--neutral-dark);
        font-size: 13px;
        font-style: normal;
        font-weight: 400;
        line-height: 12px;
        transition: border-color 0.3s, background-color 0.3s;
        box-sizing: border-box;
        text-align: left;
      }

      /* Input inválido só  se estiver preenchido */
      .label-input input:invalid:not(:placeholder-shown) {
        -webkit-appearance: none;
        background: #fff;
        color: #333;
      }

      .invalid-input {
        -webkit-appearance: none;
        border: 0.8px solid #e3062d !important;
      }

      /* Input válidado */
      .label-input input:valid {
        border-color: #848484;
        color: #333;
        -webkit-appearance: none;
        background: #fff;
        border: 1px;
      }

      /* Input foco */
      .label-input input:focus {
        outline: none;
        -webkit-appearance: none;
        box-shadow: 0 0 3px rgba(135, 135, 135, 0.4);
        background: #fff;
        border: 0.3px solid #a1a1a1;
      }

      .select-custom {
        -webkit-appearance: none;
        position: relative;
        width: 100%;
        border-radius: 4px;
        overflow: hidden;
        padding: 1.5px;
      }

      select:focus {
        outline: none !important;
        box-shadow: none !important;
        border: 0.3px solid #a1a1a1;
      }

      .select-custom select {
        padding-right: 30px;
        display: flex;
        height: 48px;
        padding: 0px 16px;
        align-items: center;
        gap: 4px;
        width: 100%;
        border-radius: 6px;
        background: #fff;
        border: none;
        -moz-appearance: none;
        appearance: none;
        color: #848484;
        font-size: 14px;
        font-style: normal;
        font-weight: 400;
        line-height: 20px;
      }

      .select-custom .ph-caret-down {
        position: absolute;
        top: 50%;
        right: 10px;
        transform: translateY(-50%);
        pointer-events: none;
        /* width: 20px;
    height: 20px; */
        fill: #333;
      }

      /* FORMULÁRIO DE CADASTRO */

      .section-formulario {
        display: grid;
        width: 100%;
        /*height: 850px;*/
        align-items: center;
        justify-content: center;
        background-color: #333;
        padding: 0 1rem;
      }

      .form-container {
        display: flex;
        width: 100%;
        max-width: 1200px;
        align-items: flex-start;
        justify-content: space-between;
        gap: 50px;
        margin: 0 auto;
        padding: 40px 20px 40px;
        justify-content: center;
        align-items: center;
      }

      @media (max-width: 1000px) {
        .form-container {
          flex-direction: column;
          align-items: center;
          gap: 20px;
          text-align: center;
        }

        .form-container > * {
          width: 100%;
        }
      }

      .franquia-info {
        display: grid;
        width: 100%;
        max-width: 580px;
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .forms {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 580px;
        padding: 32px 32px;
        gap: 24px;
        border-radius: 24px;
        /* background: #F6F6F6; */
        background: linear-gradient(
          180deg,
          #fff 0%,
          #eaf0ef 60%,
          #eaf0ef 100%,
          #eaf0ef 100%
        );
        /* background: #ECEFF1; */
        transition: height 0.5s ease;
        overflow: hidden;
        min-width: 350px;
      }

      @media (max-width: 430px) {
        .forms {
          max-width: 390px;
          padding: 32px 32px;
        }
      }

      @media (max-width: 600px) {
        .forms {
          padding: 32px 20px;
        }
      }

      h5 {
        color: #fff;
        font-size: 40px;
        font-style: normal;
        font-weight: 500;
        line-height: 120%;
      }

      @media (max-width: 1000px) {
        h5 {
          font-size: 28px;
          text-align: left;
        }
      }

      p {
        color: #969696;
        font-size: 16px;
        line-height: 24px;
        text-align: left;
      }

      figure {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: center;
      }

      .form-title {
        display: flex;
        flex-direction: column;
        align-items: center;
        align-self: stretch;
      }

      .forms-title {
        color: var(--neutral-dark);
        text-align: center;
        font-size: 28px;
        font-style: normal;
        font-weight: 900;
        line-height: 120%;
        max-width: 360px;
      }

      .container-progress-bar {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        align-self: stretch;
      }

      .line-progress {
        height: 10px;
        align-self: stretch;
        border-radius: 100px;
        background: #d4d4d4;
      }

      .progress-percent {
        color: var(--neutral-dark);
        text-align: center;
        font-size: 13px;
        font-style: normal;
        font-weight: 500;
        line-height: 100%;
        letter-spacing: 1px;
      }

      .progress-bar {
        height: 10px;
        background-color: #e3062d;
        width: 100%;
        border-radius: 100px;
        transition: width 0.5s ease-out;
      }

      .formStep1 {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
      }

      .botao-investimento {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 12px;
        font-size: 14px;
        font-style: normal;
        font-weight: 400;
        line-height: 100%;
        letter-spacing: 1px;
        text-align: center;
        color: var(--neutral-dark);
        border: none;
        border-radius: 6px;
        background-color: #ffffff;
        outline: none;
        transition: box-shadow 0.3s ease-in-out;
        cursor: pointer;
      }

      .botao-investimento:hover {
        box-shadow: inset 0 0 1.5px var(--neutral-dark);
      }

      .botao-investimento.selected {
        background-color: var(--neutral-dark);
        color: #fff;
      }

      .botao-proxima-etapa {
        display: flex;
        height: 52px;
        width: 100%;
        padding: 0px 24px;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex: 1 0 0;
        border: none;
        border-radius: 6px;
        background-color: #c7c7c7;
        color: #a4a4a4;
        font-size: 16px;
        font-style: normal;
        font-weight: 700;
        line-height: 20px;
        transition: background-color 0.3 ease-in-out;
      }

      .botao-proxima-etapa.selected {
        background-color: var(--neutral-dark);
        cursor: pointer;
        color: #fff;
      }

      .botaoProximaEtapaStep2.selected {
        background-color: var(--neutral-dark);
        cursor: pointer;
        color: #fff;
      }

      .formStep2 {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: 100%;
      }

      .sub-aviso {
        color: #919191;
        font-size: 14px;
        font-style: normal;
        font-weight: 500;
        line-height: normal;
      }

      .frame-botoes {
        display: flex;
        width: 100%;
        align-items: flex-start;
        gap: 16px;
        align-self: stretch;
        margin-top: 16px;
      }

      .botao-voltar-Step2 {
        display: flex;
        width: 52px;
        height: 52px;
        justify-content: center;
        align-items: center;
        border-radius: 6px;
        background-color: #fff;
        color: #848484;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease-in-out;
      }

      .botao-voltar-Step2:hover {
        background-color: #d2d2d2;
      }

      .botao-voltar-Step2 i {
        width: 21.333px;
        height: 16px;
        flex-shrink: 0;
      }

      .botao-voltar-Step3 {
        display: flex;
        width: 52px;
        height: 52px;
        justify-content: center;
        align-items: center;
        border-radius: 6px;
        background-color: #fff;
        color: #848484;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease-in-out;
      }

      .botao-voltar-Step3:hover {
        background-color: #d2d2d2;
      }

      .botao-voltar-Step3 i {
        width: 21.333px;
        height: 16px;
        flex-shrink: 0;
      }

      .formStep3 {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: 100%;
      }

      .checkbox-group {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        align-self: stretch;
      }

      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 8px;
        align-self: stretch;
        color: #848484;
        font-size: 12px;
        font-style: normal;
        font-weight: 400;
        line-height: normal;
        text-align: left;
      }

      @media (max-width: 600px) {
        .checkbox-item {
          font-size: 10px;
        }
      }

      input[type="checkbox"] {
        accent-color: #2865e8;
      }

      .not-robot {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 10px;
        align-self: stretch;
        border-radius: 6px;
        background: #f9f9f9;
      }

      .botaoEnviar {
        display: flex;
        height: 52px;
        width: 100%;
        padding: 0px 24px;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex: 1 0 0;
        border: none;
        border-radius: 6px;
        background-color: #c7c7c7;
        color: #a4a4a4;
        font-size: 16px;
        font-style: normal;
        font-weight: 700;
        line-height: 20px;
        transition: background-color 0.3 ease-in-out;
      }

      .botaoEnviar.selected {
        background-color: #0fa848;
        color: #fff;
        cursor: pointer;
      }

      .titleStep4 span {
        display: inline-block;
        color: var(--neutral-dark);
        text-align: center;
        font-size: 16px;
        font-weight: 400;
        line-height: 120%;
        gap: 1rem;
      }

      .botaoReset {
        display: flex;
        height: 52px;
        width: 100%;
        padding: 0px 24px;
        justify-content: center;
        align-items: center;
        gap: 8px;
        border-radius: 6px;
        border: 2px solid var(--e-commerce-prime-stroke, #e8e8e8);
        background: #fff;
        color: var(--neutral-dark);
        font-feature-settings: "liga" off, "clig" off;
        font-size: 16px;
        font-style: normal;
        font-weight: 700;
        line-height: 20px;
        cursor: pointer;
      }

      .botaoLinkEspecialista {
        display: none;
        height: 52px;
        width: 100%;
        padding: 0px 24px;
        justify-content: center;
        align-items: center;
        gap: 8px;
        border-radius: 6px;
        border: none;
        background-color: var(--neutral-dark);
        color: #fff;
        font-size: 16px;
        font-style: normal;
        font-weight: 700;
        line-height: 20px;
        white-space: nowrap;
        cursor: pointer;
      }

      @media (max-width: 600px) {
        .botaoLinkEspecialista {
          font-size: 16px;
        }
      }

      .input-error {
        outline: 1px solid red;
        border: none;
      }

      .input-container {
        position: relative;
        display: inline-block;
      }

      .tooltip {
        visibility: hidden;
        background-color: #f44336;

        color: #fff;
        text-align: left;
        border-radius: 4px;
        padding: 5px 10px;
        position: absolute;
        z-index: 1;
        top: 50%;
        left: 105%;
        transform: translateY(-50%);
        opacity: 0;
        transition: opacity 0.3s;
        width: 250px;
      }

      .tooltip::before {
        content: "";
        position: absolute;
        top: 50%;
        right: 100%;
        margin-top: -5px;
        border-width: 5px;
        border-style: solid;
        border-color: transparent #f44336 transparent transparent;
      }

      .input-container .tooltip.show {
        visibility: visible;
        opacity: 1;
      }
    </style>
  </head>
